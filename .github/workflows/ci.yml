name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-plans-reusable:
    permissions:
      contents: read
    uses: ./.github/workflows/validate-plans.yml
    with:
      validator_version: "0.1.0"
      pre_publish_tarball: true
      template_path: plugins/team-harness/skills/planning-methodology/_template.plan.md
      allow_empty: true

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Validate marketplace plugin
        run: sh scripts/check.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run verify:plan-validator
      - run: sh scripts/plan-validator-package-smoke.sh
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:plans:template
      - run: npm run validate:plans
