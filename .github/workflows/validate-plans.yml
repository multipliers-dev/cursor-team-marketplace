name: Validate plans (reusable)

on:
  workflow_call:
    inputs:
      marketplace_ref:
        description: >-
          Git commit SHA (40 hex chars, recommended) or immutable tag of
          multipliers-dev/cursor-team-marketplace for the validator checkout.
          Must match the ref pinned on the caller's uses: ...@<ref> line.
        required: true
        type: string
      template_path:
        description: >-
          Optional path relative to the caller repository root for strict template profile
          validation (e.g. .cursor/plans/_template.plan.md).
        required: false
        type: string
      allow_empty:
        description: Exit 0 when no active plans are discovered under the caller repo.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository (plans source of truth)
        uses: actions/checkout@v7
        with:
          path: caller

      - name: Validate marketplace_ref input
        id: marketplace_ref
        env:
          INPUT_REF: ${{ inputs.marketplace_ref }}
        run: |
          set -eu
          ref=$(printf '%s' "$INPUT_REF" | tr -d '[:space:]')
          if [ -z "$ref" ]; then
            echo "error: marketplace_ref is required (40-char commit SHA recommended; must match uses: multipliers-dev/cursor-team-marketplace/.github/workflows/validate-plans.yml@<same-ref>)" >&2
            exit 1
          fi
          case "$ref" in
            refs/heads/*|refs/pull/*)
              echo "error: marketplace_ref must be a marketplace commit SHA or tag, not a caller branch (got: $ref). Reusable workflows resolve caller branch names from the calling workflow — always pass marketplace_ref explicitly." >&2
              exit 1
              ;;
          esac
          if printf '%s' "$ref" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            :
          elif printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            :
          else
            echo "error: marketplace_ref must be a 40-character commit SHA or a simple tag name (got: $ref)" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Using marketplace ref: $ref"

      - name: Checkout marketplace (validator bundle only; no npm ci)
        uses: actions/checkout@v7
        with:
          repository: multipliers-dev/cursor-team-marketplace
          ref: ${{ steps.marketplace_ref.outputs.ref }}
          path: marketplace-validator

      - name: Guard validation target is caller checkout
        env:
          CALLER_ROOT: ${{ github.workspace }}/caller
          MARKETPLACE_ROOT: ${{ github.workspace }}/marketplace-validator
          BUNDLE: ${{ github.workspace }}/marketplace-validator/plugins/team-harness/dist/validate-plans.mjs
        run: |
          set -eu
          if [ "$CALLER_ROOT" = "$MARKETPLACE_ROOT" ]; then
            echo "error: caller and marketplace paths must differ" >&2
            exit 1
          fi
          if [ ! -d "$CALLER_ROOT/.git" ]; then
            echo "error: caller checkout missing .git at $CALLER_ROOT" >&2
            exit 1
          fi
          if [ ! -f "$BUNDLE" ]; then
            echo "error: missing committed validator bundle at $BUNDLE" >&2
            exit 1
          fi
          printf 'ok validation target caller=%s bundle=%s\n' "$CALLER_ROOT" "$BUNDLE"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate active plans (caller repo root)
        env:
          CALLER_ROOT: ${{ github.workspace }}/caller
          BUNDLE: ${{ github.workspace }}/marketplace-validator/plugins/team-harness/dist/validate-plans.mjs
          ALLOW_EMPTY: ${{ inputs.allow_empty }}
        run: |
          set -eu
          args=(--repo-root "$CALLER_ROOT")
          if [ "$ALLOW_EMPTY" = "true" ]; then
            args+=(--allow-empty)
          fi
          node "$BUNDLE" "${args[@]}"

      - name: Validate template (optional)
        if: inputs.template_path != ''
        env:
          CALLER_ROOT: ${{ github.workspace }}/caller
          BUNDLE: ${{ github.workspace }}/marketplace-validator/plugins/team-harness/dist/validate-plans.mjs
          TEMPLATE_PATH: ${{ inputs.template_path }}
        run: |
          set -eu
          node "$BUNDLE" \
            --repo-root "$CALLER_ROOT" \
            --profile template \
            "$CALLER_ROOT/$TEMPLATE_PATH"
