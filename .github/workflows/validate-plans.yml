name: Validate plans (reusable)

on:
  workflow_call:
    inputs:
      validator_version:
        description: >-
          Exact published semver of @multipliers-dev/plan-validator (x.y.z only).
          Must match the version consumers intend to run; never use ranges or dist-tags.
        required: true
        type: string
      pre_publish_tarball:
        description: >-
          Marketplace-internal testing only. When true, builds and installs the package
          from this repository tarball instead of the npm registry (pre-publication CI).
        required: false
        type: boolean
        default: false
      template_path:
        description: >-
          Optional path relative to the caller repository root for strict template profile
          validation.
        required: false
        type: string
      allow_empty:
        description: Exit 0 when no active plans are discovered under the caller repo.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository (plans source of truth)
        uses: actions/checkout@v7
        with:
          path: caller

      - name: Validate validator_version input
        env:
          VERSION: ${{ inputs.validator_version }}
        run: |
          set -eu
          v=$(printf '%s' "$VERSION" | tr -d '[:space:]')
          if [ -z "$v" ]; then
            echo "error: validator_version is required (exact x.y.z semver)" >&2
            exit 1
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: validator_version must be exact semver x.y.z (no ranges or tags); got: $v" >&2
            exit 1
          fi
          echo "ok validator_version=$v"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Checkout marketplace (pre-publish tarball build only)
        if: inputs.pre_publish_tarball
        uses: actions/checkout@v7
        with:
          path: marketplace-src

      - name: Install validator from local tarball (pre-publish)
        if: inputs.pre_publish_tarball
        id: tarball_install
        run: |
          set -eu
          cd marketplace-src
          npm ci
          npm run build --workspace @multipliers-dev/plan-validator
          mkdir -p "$RUNNER_TEMP/plan-validator-pack"
          pack_path=$(npm pack --workspace @multipliers-dev/plan-validator --pack-destination "$RUNNER_TEMP/plan-validator-pack" | tail -n 1)
          install_root="$RUNNER_TEMP/plan-validator-install"
          mkdir -p "$install_root"
          npm install --prefix "$install_root" --no-save "$RUNNER_TEMP/plan-validator-pack/$pack_path"
          bin="$install_root/node_modules/.bin/plan-validator"
          if [ ! -x "$bin" ]; then
            echo "error: plan-validator bin missing after tarball install" >&2
            exit 1
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Guard validation target is caller checkout
        env:
          CALLER_ROOT: ${{ github.workspace }}/caller
        run: |
          set -eu
          if [ ! -d "$CALLER_ROOT/.git" ]; then
            echo "error: caller checkout missing .git at $CALLER_ROOT" >&2
            exit 1
          fi
          printf 'ok validation target caller=%s\n' "$CALLER_ROOT"

      - name: Validate active plans (caller repo root)
        env:
          CALLER_ROOT: ${{ github.workspace }}/caller
          ALLOW_EMPTY: ${{ inputs.allow_empty }}
          VERSION: ${{ inputs.validator_version }}
          TARBALL_BIN: ${{ steps.tarball_install.outputs.bin }}
        run: |
          set -eu
          args=(--repo-root "$CALLER_ROOT")
          if [ "$ALLOW_EMPTY" = "true" ]; then
            args+=(--allow-empty)
          fi
          if [ "${{ inputs.pre_publish_tarball }}" = "true" ]; then
            "$TARBALL_BIN" "${args[@]}"
          else
            npm exec --yes --package="@multipliers-dev/plan-validator@${VERSION}" -- plan-validator "${args[@]}"
          fi

      - name: Validate template (optional)
        if: inputs.template_path != ''
        env:
          CALLER_ROOT: ${{ github.workspace }}/caller
          TEMPLATE_PATH: ${{ inputs.template_path }}
          VERSION: ${{ inputs.validator_version }}
          TARBALL_BIN: ${{ steps.tarball_install.outputs.bin }}
        run: |
          set -eu
          args=(--repo-root "$CALLER_ROOT" --profile template "$CALLER_ROOT/$TEMPLATE_PATH")
          if [ "${{ inputs.pre_publish_tarball }}" = "true" ]; then
            "$TARBALL_BIN" "${args[@]}"
          else
            npm exec --yes --package="@multipliers-dev/plan-validator@${VERSION}" -- plan-validator "${args[@]}"
          fi
