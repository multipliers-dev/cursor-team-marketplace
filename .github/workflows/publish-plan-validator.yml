name: Publish plan-validator (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Must match packages/plan-validator/package.json version (e.g. 0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm CLI with OIDC trusted publishing support
        run: |
          set -eu
          npm install -g npm@11.15.0
          npm --version

      - name: Verify manifest version
        env:
          CONFIRM: ${{ github.event.inputs.confirm_version }}
        run: |
          set -eu
          confirm=$(printf '%s' "$CONFIRM" | tr -d '[:space:]')
          manifest_version=$(node -p "require('./packages/plan-validator/package.json').version")
          if [ "$confirm" != "$manifest_version" ]; then
            echo "error: confirm_version ($confirm) != package.json ($manifest_version)" >&2
            exit 1
          fi
          echo "ok version $manifest_version"

      - name: Build package
        run: npm ci && npm run build --workspace @multipliers-dev/plan-validator

      - name: Publish to npm (trusted publishing / OIDC)
        working-directory: packages/plan-validator
        run: npm publish --provenance --access public
